<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرة حرف ق</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff7d6,#e8f7ff);font-family:Tahoma,Arial,sans-serif}
.game{width:min(92%,680px);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 12px 35px #0002}
h1{font-size:34px;margin:0 0 12px}.instruction{font-size:22px;line-height:1.7}
.letter{display:inline-flex;width:60px;height:60px;align-items:center;justify-content:center;border-radius:50%;background:#ffd45c;font-size:40px;font-weight:bold}
.inputs{display:grid;gap:14px;margin:22px 0}
.word{width:100%;padding:15px;border:3px solid #d9e2ec;border-radius:16px;font-size:22px;text-align:center;box-sizing:border-box}
.word:focus{outline:none;border-color:#70bfff}.correct{border-color:#35b86b!important;background:#ecfff3}.wrong{border-color:#ef6b6b!important;background:#fff0f0}
button{border:0;border-radius:16px;padding:14px 22px;margin:5px;font-size:19px;font-weight:bold;cursor:pointer}
#check{background:#5ecb8a;color:white}#reset{background:#e8edf2;color:#37474f}
#feedback{min-height:58px;margin-top:16px;font-size:20px;font-weight:bold;line-height:1.6}
</style>
</head>
<body>
<div class="game">
<h1>🔎 مغامرة حرف ق</h1>
<p class="instruction">ابحثي من حولك عن أشياء تبدأ بحرف <span class="letter">ق</span> واكتبي <b>3 كلمات</b>.</p>
<div class="inputs">
<input class="word" type="text" placeholder="الكلمة الأولى">
<input class="word" type="text" placeholder="الكلمة الثانية">
<input class="word" type="text" placeholder="الكلمة الثالثة">
</div>
<button id="check" type="button">✅ تحقق من إجاباتي</button>
<button id="reset" type="button">🔄 إعادة المحاولة</button>
<div id="feedback"></div>
</div>
<script>
const inputs=[...document.querySelectorAll('.word')];
const feedback=document.getElementById('feedback');
function clean(s){return s.trim().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'');}
document.getElementById('check').onclick=()=>{
 let correct=0,filled=0;
 inputs.forEach(x=>{
   x.classList.remove('correct','wrong');
   const v=clean(x.value);
   if(!v)return;
   filled++;
   if(v.startsWith('ق')){correct++;x.classList.add('correct')}
   else x.classList.add('wrong');
 });
 if(!filled) feedback.textContent='🌟 اكتبي كلمة واحدة على الأقل ثم اضغطي تحقق.';
 else if(correct===3&&filled===3) feedback.textContent='🎉 أحسنتِ يا محققة! جميع كلماتك تبدأ بحرف ق.';
 else if(correct>0) feedback.textContent='👏 رائع! لديكِ '+correct+' من 3 كلمات صحيحة. صححي الكلمات المعلّمة بالأحمر.';
 else feedback.textContent='💡 تذكّري: يجب أن تبدأ الكلمة بحرف ق. حاولي مرة أخرى!';
};
document.getElementById('reset').onclick=()=>{
 inputs.forEach(x=>{x.value='';x.classList.remove('correct','wrong')});
 feedback.textContent='';
 inputs[0].focus();
};
</script>
</body>
</html>
