<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>لعبة صوت القطار</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#dff3ff,#fff4cf);min-height:100vh;padding:18px;color:#172033}.wrap{max-width:700px;margin:auto;text-align:center}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 8px 28px #0002}.train{font-size:82px}h1{color:#2563eb}.play{border:0;border-radius:20px;padding:17px 25px;font-size:22px;font-weight:bold;background:#2563eb;color:#fff}.audio{width:100%;margin-top:18px}.words{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.word{border:4px solid #dbeafe;background:white;border-radius:22px;padding:25px;font-size:34px;font-weight:bold}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}.msg{min-height:50px;margin:18px;font-size:20px;font-weight:bold}.reset{border:0;border-radius:14px;padding:12px 20px;font-size:18px}@media(max-width:520px){.words{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><div class="train">🚂</div>
<h1>لعبة صوت القطار</h1><p>اضغطي على زر التشغيل، استمعي جيدًا، ثم اختاري الكلمة المناسبة.</p>
<button class="play" id="play">🔊 اسمعي صوت القطار</button>
<audio class="audio" id="audio" controls preload="auto"><source src="train_sound.wav" type="audio/wav"></audio>
<div class="words"><button class="word" data-correct="1">🚂 قطار</button><button class="word" data-correct="0">📖 كتاب</button></div>
<div class="msg" id="msg">ابدئي بالضغط على زر الصوت.</div><button class="reset" id="reset">🔄 إعادة اللعبة</button>
</div></div><script>
const a=document.getElementById('audio'),m=document.getElementById('msg');
document.getElementById('play').onclick=()=>{a.currentTime=0;a.play().then(()=>m.textContent='🎧 استمعي جيدًا ثم اختاري الكلمة المناسبة.').catch(()=>m.textContent='اضغطي على زر ▶️ في مشغل الصوت أسفل الزر.')};
document.querySelectorAll('.word').forEach(b=>b.onclick=()=>{document.querySelectorAll('.word').forEach(x=>x.classList.remove('correct','wrong'));if(b.dataset.correct==='1'){b.classList.add('correct');m.textContent='🎉 أحسنتِ! الإجابة: قطار.'}else{b.classList.add('wrong');m.textContent='💡 حاولي مرة أخرى.'}});
document.getElementById('reset').onclick=()=>{document.querySelectorAll('.word').forEach(x=>x.classList.remove('correct','wrong'));m.textContent='ابدئي بالضغط على زر الصوت.'};
</script></body></html>
